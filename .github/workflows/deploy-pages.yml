name: Deploy Docusaurus to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-pages.yml
      - .node-version
      - .npmrc
      - docs/**
      - docusaurus.config.js
      - package.json
      - sidebars.js
      - src/**
      - static/**
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: true

      - name: Resolve latest Docusaurus release
        id: docusaurus
        shell: bash
        run: |
          set -euo pipefail

          version="$(npm view @docusaurus/core dist-tags.latest --prefer-online)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::npm returned an invalid Docusaurus version: $version"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building with Docusaurus $version"

      - name: Install dependencies
        env:
          DOCUSAURUS_VERSION: ${{ steps.docusaurus.outputs.version }}
        shell: bash
        run: |
          npm install \
            --no-save \
            --no-package-lock \
            --prefer-offline \
            --prefer-online=false \
            --no-audit \
            --no-fund \
            "@docusaurus/core@${DOCUSAURUS_VERSION}" \
            "@docusaurus/preset-classic@${DOCUSAURUS_VERSION}"

      - name: Build site
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build
          retention-days: 1
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
